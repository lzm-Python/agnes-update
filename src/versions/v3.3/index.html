<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Agnes 工作台</title>
<style>
:root{
--bg:#0a0d13;--bg2:#11161f;--panel:#161c26;--line:#232c3a;
--txt:#e8eef7;--dim:#8a97ab;--acc:#3b82f6;--acc2:#7c3aed;--ok:#22c55e;--bad:#ef4444;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;min-width:0}
html,body{width:100%;max-width:100%;overflow-x:hidden}
body{margin:0;background:#0a0d13;color:var(--txt);
font:14px/1.55 -apple-system,system-ui,"Segoe UI","Noto Sans SC","Microsoft YaHei",sans-serif;
padding:calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 22px);min-height:100vh}
header{padding:4px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.gear{background:#131a24;border:1px solid var(--line);color:var(--dim);font-size:11px;padding:5px 10px;border-radius:8px;flex:0 0 auto}
h1{font-size:15.5px;margin:0;font-weight:600;letter-spacing:.2px}
h1 i{font-style:normal;background:linear-gradient(90deg,#4f8ef7,#8b5cf6);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:#5f6d82;font-size:10.5px;margin-top:2px;letter-spacing:.4px}
.tabs{display:flex;gap:2px;background:#0f141c;border:1px solid #1c2532;border-radius:10px;padding:3px;margin:2px 0 12px}
.tabs button{flex:1;background:transparent;border:0;color:#6f7d92;font-size:12.5px;padding:7px 0;border-radius:8px;
font-weight:500;transition:.18s}
.tabs button.on{background:#1b2a44;color:#e8eef7;box-shadow:inset 0 0 0 1px #2a4470}
.card{background:#111722;border:1px solid #1c2532;border-radius:12px;padding:12px;margin-bottom:10px}
label{display:block;font-size:11px;color:#6f7d92;margin:9px 0 5px;letter-spacing:.3px}
input,textarea,select{width:100%;background:#0a0f16;border:1px solid #1b2532;color:var(--txt);border-radius:9px;
padding:9px 10px;font-size:13.5px;font-family:inherit;outline:0;transition:border .15s}
input:focus,textarea:focus,select:focus{border-color:#2f5f9e}
textarea{resize:vertical;min-height:64px;line-height:1.5}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.chip{flex:1 1 calc(50% - 3px);border:1px solid #1b2532;background:#0a0f16;color:#7d8a9e;border-radius:8px;
padding:7px 4px;font-size:12px;text-align:center;transition:.15s}
#vmode .chip{flex:1 1 calc(33.33% - 4px)}
.chip.on{border-color:#2a4470;color:#fff;background:#16233c;font-weight:500}
.row{display:flex;gap:8px}
.row>div{flex:1}
.btn{width:100%;border:0;border-radius:9px;padding:10px;font-size:13.5px;font-weight:600;color:#fff;
background:#2563eb;margin-top:11px;transition:.15s;letter-spacing:.3px}
.btn:active{background:#1d4ed8}
.btn:disabled{opacity:.4}
.btn.ghost{background:#131a24;border:1px solid #1f2937;color:#c4cfdd;font-weight:400;margin-top:7px;font-size:12.5px}
.bar{height:3px;background:#0a0f16;border-radius:2px;overflow:hidden;margin:10px 0 5px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3b82f6,#7c3aed);transition:width .4s}
.st{font-size:11.5px;color:#6f7d92;min-height:16px}
.st b{color:#c4cfdd}
.err{color:#f87171;font-size:12px;white-space:pre-wrap;margin-top:7px}
video,img.out{width:100%;border-radius:10px;background:#000;margin-top:10px;display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
.grid img{width:100%;border-radius:9px;background:#000}
.hist{font-size:12px;color:#6f7d92;padding:7px 0;border-top:1px solid #1a2330}
.hist:first-child{border-top:0}
.hist span{color:#7aa2e8}
.script{white-space:pre-wrap;font-size:13px;line-height:1.7;background:#0a0f16;border:1px solid #1b2532;
border-radius:9px;padding:11px;margin-top:9px;max-height:400px;overflow:auto}
.tag{display:inline-block;font-size:10.5px;color:#7aa2e8;border:1px solid #24405f;border-radius:5px;padding:0 5px;margin-right:5px}
.refbox{position:relative;width:74px;height:74px;border:1px dashed #263445;border-radius:9px;
display:flex;align-items:center;justify-content:center;background:#0a0f16;overflow:hidden;margin-top:5px}
.refbox .ph{color:#5f6d82;font-size:11px;text-align:center;line-height:1.35;cursor:pointer;width:100%}
.refbox img{width:100%;height:100%;object-fit:cover;display:none}
.refbox .del{position:absolute;right:3px;top:3px;width:17px;height:17px;line-height:15px;text-align:center;
background:rgba(10,13,19,.85);border:1px solid #263445;border-radius:50%;color:#f87171;font-size:12px;display:none}
.refnote{font-size:10.5px;color:#5f6d82;margin-top:4px;line-height:1.45}
.hide{display:none!important}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1a2330;border:1px solid #263445;
color:#dbe5f1;font-size:12px;padding:8px 14px;border-radius:9px;opacity:0;transition:.25s;pointer-events:none;max-width:82%}
.toast.show{opacity:1}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1c2533;border:1px solid var(--line);
color:#fff;font-size:13px;padding:10px 16px;border-radius:10px;opacity:0;transition:.3s;pointer-events:none;max-width:84%}
.toast.show{opacity:1}
</style>
</head>
<body>

<header>
  <div>
    <h1><i>Agnes</i> 工作台</h1>
    <div class="sub">图片 · 视频 · 剧本 · 直连 API</div>
  </div>
  <button class="gear" id="gearbtn" onclick="toggleKey()">设置</button>
</header>

<div class="card hide" id="keycard">
  <label style="margin-top:0">API Key（只存本机）</label>
  <input id="keyinput" type="password" placeholder="sk-..." autocomplete="off">
  <button class="btn" onclick="saveKey()">保存 Key</button>
</div>

<div class="tabs" id="tabs">
  <button data-t="img" class="on">图片</button>
  <button data-t="vid">视频</button>
  <button data-t="script">剧本</button>
</div>

<!-- 图片 -->
<section id="panel-img">
  <div class="card">
    <label style="margin-top:0">参考图（可选）</label>
    <div class="refbox" id="rb-img">
      <input type="file" accept="image/*" id="file-img" style="display:none">
      <div class="ph" id="ph-img" onclick="pickRef('img')"><b style="font-size:16px;font-weight:400">＋</b><br>选图片</div>
      <img id="thumb-img" alt="">
      <div class="del" id="del-img" onclick="clearRef('img')">×</div>
    </div>
    <div class="refnote" id="note-img">做图生图：构图、人物、风格会跟着这张走</div>

    <label>提示词</label>
    <textarea id="iprompt" placeholder="画面内容、风格、光线、构图，越具体越稳"></textarea>
    <div class="chips" id="isize">
      <div class="chip" data-v="1K">1K 快</div>
      <div class="chip on" data-v="2K">2K 标准</div>
      <div class="chip" data-v="3K">3K 高清</div>
      <div class="chip" data-v="4K">4K 极致</div>
    </div>
    <div class="chips" id="iratio">
      <div class="chip on" data-v="1:1">1:1</div>
      <div class="chip" data-v="3:4">3:4</div>
      <div class="chip" data-v="9:16">9:16</div>
      <div class="chip" data-v="16:9">16:9</div>
    </div>
    <button class="btn" id="igo" onclick="genImage()">生成图片</button>
    <div class="bar hide" id="ibar"><i></i></div>
    <div class="st" id="ist"></div>
    <div class="err" id="ierr"></div>
    <div id="iout" class="hide">
      <img class="out" id="iimg" src="">
      <button class="btn ghost" onclick="saveImg()">保存到手机</button>
    </div>
  </div>
  <div class="card" id="ihistcard"><label style="margin-top:0">最近图片</label><div id="ihist"></div></div>
</section>

<!-- 视频 -->
<section id="panel-vid" class="hide">
  <div class="card">
    <label>生成方式</label>
    <div class="chips" id="vmode">
      <div class="chip on" data-v="text">文生视频</div>
      <div class="chip" data-v="keyframe">首尾帧</div>
      <div class="chip" data-v="reference">参考图</div>
    </div>
    <label>参考图（可选）</label>
    <div class="refbox" id="rb-vid">
      <input type="file" accept="image/*" id="file-vid" style="display:none">
      <div class="ph" id="ph-vid" onclick="pickRef('vid')"><b style="font-size:16px;font-weight:400">＋</b><br>选图片</div>
      <img id="thumb-vid" alt="">
      <div class="del" id="del-vid" onclick="clearRef('vid')">×</div>
    </div>
    <div class="refnote" id="note-vid">会当成首帧或参考图用；视频接口只认公网链接，本图会先转 Base64 试，失败就填 URL</div>

    <label>提示词</label>
    <textarea id="vprompt" placeholder="画面、动作、镜头运动。参考模式用 &lt;Picture 1&gt; 指第 1 张图"></textarea>

    <div id="vframes" class="hide">
      <label>首帧图 URL</label><input id="vfirst" placeholder="https://...">
      <label>尾帧图 URL（可选）</label><input id="vlast" placeholder="https://...">
    </div>
    <div id="vrefs" class="hide">
      <label>参考图 URL（每行一个，最多 5）</label><textarea id="vimages"></textarea>
      <label>参考音频 URL（每行一个，最多 3）</label><textarea id="vaudios"></textarea>
    </div>

    <div class="row">
      <div><label>时长</label>
        <select id="vsec"><option>4</option><option selected>5</option><option>6</option><option>8</option>
        <option>10</option><option>12</option></select></div>
      <div><label>比例</label>
        <select id="vratio"><option selected>9:16</option><option>16:9</option><option>1:1</option>
        <option>4:3</option><option>3:4</option><option>21:9</option></select></div>
    </div>

    <button class="btn" id="vgo" onclick="genVideo()">生成视频</button>
    <div class="bar hide" id="vbar"><i></i></div>
    <div class="st" id="vst"></div>
    <div class="err" id="verr"></div>

    <div id="vout" class="hide">
      <video id="vvid" controls playsinline webkit-playsinline></video>
      <button class="btn ghost" onclick="saveVid()">保存到手机</button>
      <button class="btn ghost" onclick="toScript()">用这段做分镜</button>
    </div>
  </div>
  <div class="card" id="vhistcard"><label style="margin-top:0">最近视频</label><div id="vhist"></div></div>
</section>

<!-- 剧本 -->
<section id="panel-script" class="hide">
  <div class="card">
    <label style="margin-top:0">参考图（可选）</label>
    <div class="refbox" id="rb-script">
      <input type="file" accept="image/*" id="file-script" style="display:none">
      <div class="ph" id="ph-script" onclick="pickRef('script')"><b style="font-size:16px;font-weight:400">＋</b><br>选图片</div>
      <img id="thumb-script" alt="">
      <div class="del" id="del-script" onclick="clearRef('script')">×</div>
    </div>
    <div class="refnote" id="note-script">给图让模型照着你的人物/场景写分镜</div>

    <label>题材 / 一句话</label>
    <textarea id="sidea" placeholder="例：重生回到高考前三个月，主角是镇上卖鱼的少年"></textarea>
    <div class="chips" id="sstyle">
      <div class="chip on" data-v="短剧">短剧</div>
      <div class="chip" data-v="广告">广告</div>
      <div class="chip" data-v="口播">口播</div>
      <div class="chip" data-v="故事">故事</div>
    </div>
    <div class="row">
      <div><label>镜头数</label>
        <select id="sshot"><option>3</option><option selected>5</option><option>8</option><option>10</option></select></div>
      <div><label>每镜时长</label>
        <select id="slen"><option>4</option><option selected>5</option><option>6</option><option>8</option></select></div>
    </div>
    <button class="btn" id="sgo" onclick="genScript()">生成分镜剧本</button>
    <div class="err" id="serr"></div>
    <div id="sout" class="hide">
      <div class="script" id="stxt"></div>
      <button class="btn ghost" onclick="copyScript()">复制全文</button>
      <button class="btn ghost" onclick="useShot()">取第 1 镜当视频提示词</button>
    </div>
  </div>
</section>

<div class="toast" id="toast"></div>

<script>
var API='https://apihub.agnes-ai.com';
var IMG_MODEL='agnes-image-2.1-flash';
var VID_MODEL='agnes-video-2.5-flash';
var TXT_MODEL='agnes-2.5-flash';

var tab='img',vMode='text',imgSize='2K',imgRatio='1:1',sStyle='短剧';
var curImg=null,curVid=null,curScript='',lastShot='',vTimer=null;
var refs={img:null,vid:null,script:null};

function $(id){return document.getElementById(id)}
function getKey(){return localStorage.getItem('agnes_key')||''}
function tip(m){var t=$('toast');t.textContent=m;t.className='toast show';setTimeout(function(){t.className='toast'},1800)}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function err(id,m){$(id).textContent=m||''}
function prog(id,p){var b=$(id);b.classList.remove('hide');b.querySelector('i').style.width=(p||0)+'%'}
function q(id){return ($(id).value||'').trim()}
function checklist(id,val){if(!id)return [];return (document.getElementById(id).value||'').split('\n').map(function(s){return s.trim()}).filter(Boolean)}

// ===== 参考图 =====
function pickRef(which){
  if(window.Android&&Android.pickImage){Android.pickImage(which);return}
  var f=$('file-'+which);if(f)f.click()
}
function onImagePicked(which,data,w,h){
  if(!data){tip('读取失败，换一张');return}
  refs[which]=data;
  $('thumb-'+which).src=data;
  $('thumb-'+which).style.display='block';
  $('ph-'+which).style.display='none';
  $('del-'+which).style.display='block';
  tip('已加参考图 '+w+'×'+h);
}
function clearRef(which){
  refs[which]=null;
  $('thumb-'+which).style.display='none';
  $('ph-'+which).style.display='block';
  $('del-'+which).style.display='none';
  $('file-'+which).value='';
}
function compressImg(file,cb){
  var r=new FileReader();
  r.onload=function(){
    var im=new Image();
    im.onload=function(){
      var max=1280,w=im.width,h=im.height;
      if(!w||!h){cb(null);return}
      if(w>=h&&w>max){h=Math.round(h*max/w);w=max}
      else if(h>w&&h>max){w=Math.round(w*max/h);h=max}
      var c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(im,0,0,w,h);
      try{cb(c.toDataURL('image/jpeg',0.85),w,h)}catch(e){cb(null)}
    };
    im.onerror=function(){cb(null)};
    im.src=r.result;
  };
  r.onerror=function(){cb(null)};
  r.readAsDataURL(file);
}
['img','vid','script'].forEach(function(k){
  var f=$('file-'+k);
  if(!f)return;
  f.addEventListener('change',function(e){
    var file=e.target.files&&e.target.files[0];
    if(!file)return;
    tip('处理图片…');
    compressImg(file,function(data,w,h){
      if(!data){tip('读取失败，换一张');clearRef(k);return}
      refs[k]=data;
      $('thumb-'+k).src=data;
      $('thumb-'+k).style.display='block';
      $('ph-'+k).style.display='none';
      $('del-'+k).style.display='block';
      tip('已加参考图 '+w+'×'+h);
    });
  });
});

// ===== Tab 切换 =====
Array.prototype.forEach.call(document.querySelectorAll('#tabs button'),function(b){
  b.onclick=function(){
    Array.prototype.forEach.call(document.querySelectorAll('#tabs button'),function(x){x.classList.remove('on')});
    b.classList.add('on');tab=b.dataset.t;
    ['img','vid','script'].forEach(function(k){$('panel-'+k).classList.toggle('hide',k!==tab)});
    window.scrollTo({top:0});
  };
});

// ===== 选项 chip =====
Array.prototype.forEach.call(document.querySelectorAll('#isize .chip'),function(c){
  c.onclick=function(){Array.prototype.forEach.call(document.querySelectorAll('#isize .chip'),function(x){x.classList.remove('on')});c.classList.add('on');imgSize=c.dataset.v};
});
Array.prototype.forEach.call(document.querySelectorAll('#iratio .chip'),function(c){
  c.onclick=function(){Array.prototype.forEach.call(document.querySelectorAll('#iratio .chip'),function(x){x.classList.remove('on')});c.classList.add('on');imgRatio=c.dataset.v};
});
Array.prototype.forEach.call(document.querySelectorAll('#vmode .chip'),function(c){
  c.onclick=function(){
    Array.prototype.forEach.call(document.querySelectorAll('#vmode .chip'),function(x){x.classList.remove('on')});
    c.classList.add('on');vMode=c.dataset.v;
    $('vframes').classList.toggle('hide',vMode!=='keyframe');
    $('vrefs').classList.toggle('hide',vMode!=='reference');
  };
});
Array.prototype.forEach.call(document.querySelectorAll('#sstyle .chip'),function(c){
  c.onclick=function(){Array.prototype.forEach.call(document.querySelectorAll('#sstyle .chip'),function(x){x.classList.remove('on')});c.classList.add('on');sStyle=c.dataset.v};
});

// ===== Key 检查 =====
function needKey(){if(!getKey()){tip('先在设置里填 API Key');openKey();return false}return true}
function openKey(){
  var c=$('keycard');
  c.classList.remove('hide');
  $('keyinput').value=getKey();
  window.scrollTo({top:0,behavior:'smooth'});
}
function toggleKey(){
  var c=$('keycard');
  if(c.classList.contains('hide')){openKey()}else{c.classList.add('hide')}
}
function saveKey(){
  var k=($('keyinput').value||'').trim();
  if(!k){tip('Key 不能为空');return}
  localStorage.setItem('agnes_key',k);
  $('keycard').classList.add('hide');
  $('gearbtn').textContent='已设置';
  tip('Key 已保存');
}

// ===== 图片 =====
function genImage(){
  err('ierr','');
  if(!needKey())return;
  var p=q('iprompt');
  if(!p){err('ierr','先写提示词');return}
  $('igo').disabled=true;$('igo').textContent='生成中…';
  $('ist').textContent='请求图像模型 '+imgSize+' '+imgRatio+(refs.img?' · 图生图':'');
  prog('ibar',30);
  var ipayload={model:IMG_MODEL,prompt:p,size:imgSize,ratio:imgRatio};
  if(refs.img){ipayload.image=[refs.img]}
  fetch(API+'/v1/images/generations',{method:'POST',headers:{'Authorization':'Bearer '+getKey(),'Content-Type':'application/json'},
    body:JSON.stringify(ipayload)
  }).then(function(r){return r.json().then(function(j){return {ok:r.ok,code:r.status,j:j}})})
  .then(function(res){
    $('igo').disabled=false;$('igo').textContent='生成图片';
    if(!res.ok){prog('ibar',0);err('ierr',res.code===401?'Key 无效':('生成失败：'+((res.j&&res.j.detail)||JSON.stringify(res.j))));return}
    var d=res.j.data&&res.j.data[0]||res.j;
    var url=d.url||(d.b64_json?('data:image/png;base64,'+d.b64_json):null);
    if(!url){err('ierr','没有返回图片：'+JSON.stringify(res.j).slice(0,200));return}
    prog('ibar',100);$('ist').textContent='完成';
    curImg={url:url,prompt:p,ts:Date.now()};
    $('iimg').src=url;$('iout').classList.remove('hide');
    addImgHist(curImg);tip('图片已生成');
  }).catch(function(e){$('igo').disabled=false;$('igo').textContent='生成图片';err('ierr','网络失败：'+e.message)});
}
function saveImg(){
  if(!curImg)return;
  if(window.Android&&Android.saveFile){Android.saveFile(curImg.url,curImg.prompt.slice(0,20)||'agnes','image/png')}
  else{window.open(curImg.url,'_blank')}
}
function addImgHist(it){
  var a=[];try{a=JSON.parse(localStorage.getItem('agnes_img')||'[]')}catch(e){}
  a.push(it);a=a.slice(-20);localStorage.setItem('agnes_img',JSON.stringify(a));renderImgHist();
}
function renderImgHist(){
  var box=$('ihist'),a=[];try{a=JSON.parse(localStorage.getItem('agnes_img')||'[]')}catch(e){}
  box.innerHTML='';
  a.slice().reverse().forEach(function(it){
    var d=document.createElement('div');d.className='hist';
    d.textContent=(it.prompt||'').slice(0,26)+'  ';var s=document.createElement('span');s.textContent=new Date(it.ts).toLocaleTimeString();d.appendChild(s);
    d.onclick=function(){curImg=it;$('iimg').src=it.url;$('iout').classList.remove('hide');window.scrollTo({top:0,behavior:'smooth'})};
    box.appendChild(d);
  });
}

// ===== 视频 =====
function genVideo(){
  err('verr','');
  if(!needKey())return;
  var body={model:VID_MODEL,mode:vMode,prompt:q('vprompt'),seconds:$('vsec').value,size:'720P',aspect_ratio:$('vratio').value};
  if(!body.prompt){err('verr','先写提示词');return}
  if(vMode==='text'&&refs.vid){body.mode='keyframe';body.first_frame=refs.vid}
  if(vMode==='keyframe'){
    body.first_frame=q('vfirst')||(refs.vid||'');
    body.last_frame=q('vlast');
    if(!body.first_frame&&!body.last_frame){err('verr','首帧或尾帧至少填一个，或选一张参考图');return}
  }
  if(vMode==='reference'){
    body.images=checklist('vimages');
    if(refs.vid){body.images=body.images.concat([refs.vid])}
    body.audios=checklist('vaudios');
    if(!body.images.length&&!body.audios.length){err('verr','参考图或参考音频至少给一个');return}
  }
  $('vgo').disabled=true;$('vgo').textContent='提交中…';
  $('vst').textContent='排队中…';prog('vbar',3);
  fetch(API+'/v1/videos',{method:'POST',headers:{'Authorization':'Bearer '+getKey(),'Content-Type':'application/json'},body:JSON.stringify(body)})
  .then(function(r){return r.json().then(function(j){return {ok:r.ok,code:r.status,j:j}})})
  .then(function(res){
    if(!res.ok){
      $('vgo').disabled=false;$('vgo').textContent='生成视频';prog('vbar',0);
      err('verr',res.code===401?'Key 无效':('创建失败：'+((res.j&&res.j.detail)||JSON.stringify(res.j))));return;
    }
    var vid=res.j.video_id||res.j.id;
    curVid={video_id:vid,url:null,prompt:body.prompt,ts:Date.now()};
    $('vst').innerHTML='任务 <b>'+vid.slice(-10)+'</b> 排队';
    pollVideo(vid);
  }).catch(function(e){$('vgo').disabled=false;$('vgo').textContent='生成视频';err('verr','网络失败：'+e.message)});
}
function pollVideo(vid){
  clearInterval(vTimer);var n=0;
  vTimer=setInterval(function(){
    n++;
    fetch(API+'/agnesapi?video_id='+encodeURIComponent(vid)+'&model_name='+VID_MODEL,
      {headers:{'Authorization':'Bearer '+getKey()}})
    .then(function(r){return r.json()})
    .then(function(j){
      if(j.error||j.detail){
        clearInterval(vTimer);$('vgo').disabled=false;$('vgo').textContent='生成视频';
        err('verr','查询失败：'+((j.error&&j.error.detail)||j.detail));return;
      }
      var p=typeof j.progress==='number'?j.progress:0;prog('vbar',p);
      $('vst').innerHTML='状态 <b>'+j.status+'</b> · '+p+'%';
      if(j.status==='completed'){
        clearInterval(vTimer);prog('vbar',100);$('vst').textContent='完成';
        curVid.url=j.url;curVid.video_id=vid;
        $('vvid').src=j.url;$('vout').classList.remove('hide');
        $('vgo').disabled=false;$('vgo').textContent='生成视频';addVidHist(curVid);
      }else if(j.status==='failed'){
        clearInterval(vTimer);$('vgo').disabled=false;$('vgo').textContent='生成视频';
        err('verr','任务失败');
      }else if(n>180){
        clearInterval(vTimer);$('vgo').disabled=false;$('vgo').textContent='生成视频';
        err('verr','轮询超时，可稍后在历史里找回');
      }
    }).catch(function(){});
  },2000);
}
function saveVid(){
  if(!curVid||!curVid.url)return;
  if(window.Android&&Android.saveFile){Android.saveFile(curVid.url,curVid.prompt.slice(0,20)||'agnes','video/mp4')}
  else{window.open(curVid.url,'_blank')}
}
function addVidHist(it){
  var a=[];try{a=JSON.parse(localStorage.getItem('agnes_vid')||'[]')}catch(e){}
  a.push(it);a=a.slice(-20);localStorage.setItem('agnes_vid',JSON.stringify(a));renderVidHist();
}
function renderVidHist(){
  var box=$('vhist'),a=[];try{a=JSON.parse(localStorage.getItem('agnes_vid')||'[]')}catch(e){}
  box.innerHTML='';
  a.slice().reverse().forEach(function(it){
    if(!it.url)return;
    var d=document.createElement('div');d.className='hist';
    d.textContent=(it.prompt||'').slice(0,26)+'  ';var s=document.createElement('span');s.textContent=new Date(it.ts).toLocaleTimeString();d.appendChild(s);
    d.onclick=function(){curVid=it;$('vvid').src=it.url;$('vout').classList.remove('hide');window.scrollTo({top:0,behavior:'smooth'})};
    box.appendChild(d);
  });
}

// ===== 剧本 =====
function genScript(){
  err('serr','');
  if(!needKey())return;
  var idea=q('sidea');
  if(!idea){err('serr','先写题材');return}
  var shots=$('sshot').value,len=$('slen').value;
  var sys='你是短视频编导。只输出分镜表，不要解释、不要客套。每个镜头严格按下面格式，镜头之间空一行：\n'
    +'镜头1（'+len+'秒）\n画面：具体的画面描述，必须是可以直接拿去生成视频的完整提示词，包含主体、动作、环境、光线、镜头运动\n'
    +'台词：一句台词或音效提示，没有就写“无”\n';
  var usr='题材：'+idea+'\n类型：'+sStyle+'\n镜头数：'+shots+'\n每镜时长：'+len+'秒\n整体要结构完整：开场钩子—推进—转折—收尾。';
  $('sgo').disabled=true;$('sgo').textContent='生成中…';
  function send(withImg,allowRetry){
    var msg={role:'user',content:usr};
    if(withImg){
      msg.content=[{type:'text',text:usr},{type:'image_url',image_url:{url:refs.script}}];
    }
    var payload={model:TXT_MODEL,messages:[{role:'system',content:sys},msg],temperature:0.8};
    return fetch(API+'/v1/chat/completions',{method:'POST',headers:{'Authorization':'Bearer '+getKey(),'Content-Type':'application/json'},
      body:JSON.stringify(payload)})
    .then(function(r){return r.json().then(function(j){return {ok:r.ok,code:r.status,j:j}})})
    .then(function(res){
      if(!res.ok&&withImg&&allowRetry){
        tip('这个模型不吃参考图，改纯文字重试');
        return send(false,false);
      }
      $('sgo').disabled=false;$('sgo').textContent='生成分镜剧本';
      if(!res.ok){err('serr',res.code===401?'Key 无效':('生成失败：'+((res.j&&res.j.detail)||JSON.stringify(res.j))));return}
      var c=res.j.choices&&res.j.choices[0]&&res.j.choices[0].message&&res.j.choices[0].message.content;
      if(!c){err('serr','无返回内容');return}
      if(typeof c!=='string'){c=JSON.stringify(c)}
      curScript=c;
      var m=c.match(/镜头1[\s\S]*?画面：([\s\S]*?)(?:\n台词|$)/);
      lastShot=m?m[1].trim():'';
      $('stxt').innerHTML=esc(c);$('sout').classList.remove('hide');
      localStorage.setItem('agnes_last_script',c);
      tip('剧本已生成');
    }).catch(function(e){$('sgo').disabled=false;$('sgo').textContent='生成分镜剧本';err('serr','网络失败：'+e.message)});
  }
  send(!!refs.script,true);
}
function copyScript(){
  if(!curScript)return;
  var t=document.createElement('textarea');t.value=curScript;document.body.appendChild(t);t.select();
  try{document.execCommand('copy');tip('已复制')}catch(e){tip('复制失败')}
  document.body.removeChild(t);
}
function useShot(){
  if(!lastShot){tip('没有可用的镜头');return}
  $('vprompt').value=lastShot;
  Array.prototype.forEach.call(document.querySelectorAll('#tabs button'),function(x){x.classList.remove('on')});
  document.querySelectorAll('#tabs button')[1].classList.add('on');
  $('panel-img').classList.add('hide');$('panel-script').classList.add('hide');$('panel-vid').classList.remove('hide');
  window.scrollTo({top:0,behavior:'smooth'});tip('已填入视频提示词');
}
function toScript(){
  $('sidea').value=q('vprompt');
  document.querySelectorAll('#tabs button')[2].click();
}

// ===== 初始化 =====
renderImgHist();renderVidHist();
if(getKey()){$('gearbtn').textContent='已设置'}else{$('keycard').classList.remove('hide')};
</script>
